name: Deploy snapshot with Gradle

on:
  push:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://repo.andrei1058.com
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Deploy snapshot with Gradle
        env:
          MVN_REPO_TOKEN: ${{ secrets.MVN_REPO_TOKEN }}
          ANDEV_RES_ID: 1
        run: |
          sudo apt install jq -y
          curl -X GET https://api.andrei1058.com/v1/resources/$ANDEV_RES_ID/versioning/current -H "Accept: application/json" >> version.json
          export UPDATE_VERSION=`jq '.version' version.json | tr -d '"'`
          ./gradlew build :bedwars-api:publish -Pversion=$UPDATE_VERSION-SNAPSHOT
          echo "UPDATE_VERSION=$UPDATE_VERSION" >> $GITHUB_ENV
